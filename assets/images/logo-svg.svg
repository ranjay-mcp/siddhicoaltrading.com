<svg width="40" height="40" viewBox="0 0 240 240" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <defs>
    <linearGradient id="sctAmber" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
    <linearGradient id="sctCoalDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4B5563"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="sctCoalMid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#374151"/>
      <stop offset="100%" stop-color="#1F2937"/>
    </linearGradient>
  </defs>
  <!-- Faceted Coal Base -->
  <polygon points="120,200 60,130 120,60 145,100" fill="url(#sctCoalMid)" />
  <polygon points="60,130 120,200 120,230 40,150" fill="url(#sctCoalDark)" />
  <polygon points="120,200 180,220 120,230" fill="url(#sctCoalMid)" />
  <polygon points="120,200 155,160 180,220" fill="url(#sctCoalDark)" />
  <polygon points="120,135 145,100 155,160 120,200" fill="url(#sctCoalDark)" />
  <!-- Ascending Growth Arrow -->
  <polygon points="120,60 180,130 155,160" fill="url(#sctAmber)" opacity="0.9" />
  <polygon points="180,130 200,80 155,160" fill="url(#sctAmber)" />
  <polygon points="120,60 160,20 200,80" fill="url(#sctAmber)" />
  <polygon points="160,20 200,80 180,130" fill="url(#sctAmber)" opacity="0.85" />
</svg>
